stages:
  - deploy_prod

deploy_to_prod:
  stage: deploy_prod
  image: registry:5000/ci-tools/rsync-ssh:20
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H  $SSH_PORT_CHEF $CHEF_SERVER >> ~/.ssh/known_hosts
  script:
    - chmod 600 $SSH_PRIVKEY_CHEF
    # Синхронизируем файлы из репозитория в папку на сервере
    - rsync -avz -e "ssh $SSH_PORT_SUP -i $SSH_PRIVKEY_SUP" --delete ./site $SSH_LOGIN@$SUP_SERVER:/var/prod/html/mrp1gnum.ru/
    - ssh $SSH_PORT_CHEF -i $SSH_PRIVKEY_CHEF -o StrictHostKeyChecking=no $SSH_LOGIN@$CHEF_SERVER "docker restart nginx"

    # Если требуется перезапустить веб-сервер:
    # - ssh $SERVER_USER@$SERVER_HOST "systemctl restart nginx"

